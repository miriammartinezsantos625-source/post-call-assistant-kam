[theme]
base = "light"
primaryColor = "#1F4E79"
backgroundColor = "#F4F6F8"
secondaryBackgroundColor = "#ECEEF0"
textColor = "#1F2328"
linkColor = "#1F4E79"
borderColor = "#D5DEE8"
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap, sans-serif"
headingFont = "Source Serif 4:https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400;1,8..60,500&display=swap, Georgia, serif"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap, monospace"
headingFontWeights = 500
baseFontSize = 15
baseRadius = "8px"
buttonRadius = "6px"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#0B1929"
secondaryBackgroundColor = "#13263A"
textColor = "#E3E8ED"
borderColor = "#1E3348"
primaryColor = "#FFFFFF"

[server]
headless = true
maxUploadSize = 25

[browser]
gatherUsageStats = false
